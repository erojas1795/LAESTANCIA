<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casa La Estancia</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"><style id="app-css">
/* Layout: the house plan is the stage, Alexa's screen is the console beside it, and the quote reads below it like a spec sheet. One deliberate night look. */
:root{
  --ink:#0a0d12; --slab:#121722; --slab2:#181f2c; --line:#273042; --mist:#8f99ac; --paper:#edf0f5; --bezel:#050709;
  --glow:#ffbe5c; --sound:#c4b2ff; --air:#73d4ff; --ok:#7ee0a5; --warn:#ffcf7a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand b{color:var(--glow)}
.brand span{font-weight:400;font-size:12px;letter-spacing:.32em;color:var(--mist);font-family:var(--f-mono)}
.top .who{text-align:right;font-size:13px;color:var(--mist)}
.top .who strong{color:var(--paper);font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:40px 28px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6.4vw,88px);line-height:.92;letter-spacing:-.035em;margin:10px 0 0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--glow)}
.hero p{margin:0;color:var(--mist);max-width:46ch;font-size:16px}
.pillars{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.pillar{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.l{background:var(--glow);box-shadow:0 0 12px var(--glow)}
.dot.s{background:var(--sound);box-shadow:0 0 12px var(--sound)}
.dot.a{background:var(--air);box-shadow:0 0 12px var(--air)}

/* scenes */
.scenes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.scene{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 14px 12px;background:var(--slab);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,background .2s,transform .2s}
.scene:hover{border-color:var(--glow);transform:translateY(-2px)}
.scene.run{background:var(--slab2);border-color:var(--glow)}
.scene svg{width:22px;height:22px;color:var(--glow)}
.scene strong{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.scene small{font-family:var(--f-mono);font-size:11px;color:var(--mist)}

/* sim */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.plan{background:var(--slab);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.levels{display:flex;gap:4px;background:var(--ink);padding:4px;border-radius:12px;flex-wrap:wrap}
.levels button{background:none;border:0;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--mist);display:flex;gap:8px;align-items:baseline}
.levels button small{font-family:var(--f-mono);font-size:10px;opacity:.7}
.levels button[aria-pressed="true"]{background:var(--slab2);color:var(--paper)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mist);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.stage{position:relative}
#svg{display:block;width:100%;height:auto}
.room{cursor:pointer}
.room.ctx{cursor:default}
.room .edge{fill:none;stroke:transparent;stroke-width:3}
.room:hover .edge,.room:focus .edge{stroke:var(--mist)}
.room.sel .edge{stroke:var(--glow)}
.room:focus{outline:none}
.fx-core{transition:fill .5s}
.fx-halo{transition:opacity .6s}
.glowr{transition:opacity .7s}
.airtint{transition:opacity .7s}
.flow{stroke-dasharray:4 7;opacity:0;transition:opacity .4s}
.room.ac-on .flow{opacity:1;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.wave{fill:none;stroke:var(--sound);opacity:0;transform-box:fill-box;transform-origin:center}
.room.mus-on .wave{animation:wave 2.4s ease-out infinite}
.room.mus-on .wave.w2{animation-delay:.8s}
.room.mus-on .wave.w3{animation-delay:1.6s}
@keyframes wave{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.spk{fill:var(--slab2);stroke:var(--sound);stroke-width:1.5;opacity:.45;transition:opacity .4s}
.room.mus-on .spk{opacity:1}
.cur{transition:height .9s ease,width .9s ease;fill:var(--mist)}
.glass{transition:stroke .6s,stroke-width .6s}
.rlabel{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--mist);pointer-events:none}
.room.lit .rlabel{fill:var(--paper)}
.casc{stroke:var(--air);stroke-dasharray:3 5;opacity:0}
.casc.on{opacity:1;animation:flow .7s linear infinite}
.timebar{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.timebar input{flex:1;accent-color:var(--glow)}
.timebar .t{font-family:var(--f-mono);font-size:20px;min-width:62px}
.timebar svg{width:18px;height:18px;color:var(--mist);flex:none}
.plan-note{font-size:11.5px;color:var(--mist);padding:0 14px 12px}

/* echo show */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.echo{background:var(--bezel);border-radius:22px;padding:12px;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.screen{border-radius:12px;padding:16px;min-height:250px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,190,92,.16),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(115,212,255,.12),transparent 60%),var(--slab);position:relative;overflow:hidden}
.screen .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.clock{font-family:var(--f-display);font-weight:600;font-size:46px;line-height:1;letter-spacing:-.03em}
.greet{font-size:13px;color:var(--mist);margin-top:4px}
.ring{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);flex:none;transition:border-color .3s,box-shadow .3s}
.ring.on{border-color:var(--air);box-shadow:0 0 18px var(--air),inset 0 0 10px var(--air);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px var(--air),inset 0 0 14px var(--air)}}
.say{margin-top:14px;font-family:var(--f-display);font-size:19px;font-weight:600;min-height:28px;letter-spacing:-.01em}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;min-height:20px}
.steps li{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--paper);animation:in .35s ease both}
.steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ok);background:radial-gradient(circle,var(--ok) 0 3px,transparent 4px);flex:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.tile{background:rgba(255,255,255,.04);border-radius:9px;padding:8px}
.tile svg{width:16px;height:16px}
.tile b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:500;margin-top:4px}
.tile span{font-size:10.5px;color:var(--mist)}
.tile.l svg{color:var(--glow)} .tile.s svg{color:var(--sound)} .tile.a svg{color:var(--air)} .tile.k svg{color:var(--ok)}
.echo-cap{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--mist);padding:8px 4px 0;letter-spacing:.08em;text-transform:uppercase}

/* room panel */
.panel{background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel h3{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em;margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mist)}
.chip.opt{border-color:var(--warn);color:var(--warn)}
.block{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.block-h .eyebrow{display:flex;align-items:center;gap:6px}
.block-h svg{width:15px;height:15px}
.circs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.circ{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink);text-align:left;font-size:13px;transition:border-color .2s,background .2s}
.circ i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;transition:background .3s,box-shadow .3s}
.circ[aria-pressed="true"]{border-color:rgba(255,190,92,.6);background:rgba(255,190,92,.08)}
.circ[aria-pressed="true"] i{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--mist)}
.mini:hover{color:var(--paper);border-color:var(--mist)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;min-width:120px}
.r-s{accent-color:var(--sound)} .r-c{accent-color:var(--glow)}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--sound);background:none;display:grid;place-items:center;color:var(--sound);flex:none}
.play svg{width:16px;height:16px}
.play[aria-pressed="true"]{background:var(--sound);color:var(--ink)}
select.sel{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;min-width:0;max-width:100%}
.therm{display:flex;align-items:center;gap:12px}
.therm .deg{font-family:var(--f-display);font-weight:600;font-size:38px;letter-spacing:-.03em;min-width:92px;line-height:1}
.therm .deg small{font-size:16px;color:var(--mist)}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--ink);font-size:18px;line-height:1}
.round:hover{border-color:var(--air)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mist)}
.seg button[aria-pressed="true"]{border-color:var(--air);color:var(--air)}
.tog{position:relative;width:42px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--ink);flex:none;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mist);transition:transform .25s,background .25s}
.tog[aria-pressed="true"]{border-color:var(--ok)}
.tog[aria-pressed="true"]::after{transform:translateX(18px);background:var(--ok)}
.tog.a[aria-pressed="true"]{border-color:var(--air)} .tog.a[aria-pressed="true"]::after{background:var(--air)}
.hint{font-size:12px;color:var(--mist);margin:6px 0 0}
.panel .empty{color:var(--mist);font-size:13px}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-block:48px 0}
.num{background:var(--ink);padding:18px 16px}
.num b{display:block;font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.num span{font-size:13px;color:var(--mist)}

/* quote */
.quote{padding-block:56px 40px}
.q-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.q-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4.4vw,56px);letter-spacing:-.03em;line-height:.95;margin:8px 0 0}
.q-head p{color:var(--mist);margin:8px 0 0;max-width:52ch}
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.mode{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--slab)}
.mode strong{display:block;font-family:var(--f-display);font-weight:600;font-size:16px}
.mode span{font-size:12.5px;color:var(--mist)}
.mode[aria-pressed="true"]{border-color:var(--glow);background:var(--slab2)}
.group{margin-bottom:18px}
.group h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:500}
.group h4 .dot{width:7px;height:7px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--slab)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:500;text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .n{font-weight:600}
td .d{display:block;font-size:12.5px;color:var(--mist);margin-top:2px;max-width:56ch}
td.m{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.tbd{color:var(--warn);font-family:var(--f-mono);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--slab);text-align:left}
.opt.on{border-color:rgba(126,224,165,.55)}
.opt .txt{flex:1;min-width:0}
.opt .txt b{display:block;font-weight:600;font-size:14px}
.opt .txt span{display:block;font-size:12.5px;color:var(--mist)}
.opt .txt em{display:block;font-style:normal;font-family:var(--f-mono);font-size:12.5px;margin-top:6px}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:18px}
.sum .line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.sum .line span:last-child{font-family:var(--f-mono)}
.sum .total{display:flex;flex-direction:column;gap:2px;padding-top:14px}
.sum .total b{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.sum .total span{font-size:12px;color:var(--mist)}
.sum .pend{margin-top:12px;font-size:12.5px;color:var(--warn)}
.sum .meta{margin-top:14px;font-size:12px;color:var(--mist);display:flex;flex-direction:column;gap:4px}
.contact{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px}
.contact .c{display:flex;justify-content:space-between;gap:8px;align-items:center}
.contact .c span{user-select:all;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.foot{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--mist);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* admin */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--glow);color:var(--ink);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:rgba(5,7,9,.6)}
.drawer .in{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--slab);border-left:1px solid var(--line);padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px}
.drawer h3{font-family:var(--f-display);font-size:24px;margin:0 0 4px}
.drawer .ar{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.drawer .ar.sw{grid-template-columns:minmax(0,1fr) 64px 92px 92px}
.drawer input,.drawer select{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;width:100%;min-width:0}
.drawer label{font-size:12px;color:var(--mist);display:flex;flex-direction:column;gap:4px}
.drawer .hdr{font-family:var(--f-mono);font-size:10px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase}
.drawer .gen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.drawer .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:0;background:var(--slab);padding-top:12px}
.btn{border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:none}
.btn.p{background:var(--glow);color:var(--ink);border-color:var(--glow);font-weight:600}
.status{font-size:12.5px;color:var(--mist);margin-top:8px;min-height:18px}

@media (max-width:1100px){.scenes{grid-template-columns:repeat(3,minmax(0,1fr))}.sim,.q-grid{grid-template-columns:minmax(0,1fr)}.sum{position:static}.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  var on=!!Q.opts[it.id],sub=it.price*it.qty;
  if(on){optT+=sub;if(!it.price||!it.qty)pend++}
  var pr=it.qty>0?(it.price?un(it.qty,it.u)+' × '+money(it.price)+' = '+money(sub):un(it.qty,it.u)+' · por cotizar'):'Metraje o cantidad por definir';
  return '<div class="opt'+(on?' on':'')+'"><div class="txt"><b>'+esc(it.name)+'</b><span>'+esc(it.det)+'</span><em>'+pr+'</em></div><button class="tog" data-opt="'+it.id+'" aria-pressed="'+on+'" aria-label="Incluir '+esc(it.name)+'"></button></div>';
 }).join('');
 var subtotal=base+optT,igv=CFG.igv==='mas'?subtotal*.18:0,total=subtotal+igv;
 var c=CFG.contacto||{};
 document.getElementById('sum').innerHTML='<div class="eyebrow">Resumen</div>'+
  '<div class="line"><span>Sistema base</span><span>'+money(base)+'</span></div>'+
  '<div class="line"><span>Opcionales elegidos</span><span>'+money(optT)+'</span></div>'+
  (CFG.igv==='mas'?'<div class="line"><span>IGV 18 %</span><span>'+money(igv)+'</span></div>':'')+
  '<div class="total"><span>Total</span><b class="mono">'+money(total)+'</b><span>'+(CFG.igv==='mas'?'Incluye IGV':'Precios con IGV incluido')+' · Interruptores: '+(Q.mode==='placa'?'placa domotizada':'Sonoff en caja')+'</span></div>'+
  (pend?'<div class="pend">'+pend+(pend>1?' ítems pendientes':' ítem pendiente')+' de precio o metraje. Se suman al total cuando DO SMART los confirme.</div>':'')+
  '<div class="meta"><span>Validez de la propuesta: '+esc(CFG.validez)+'</span>'+(CFG.nota?'<span>'+esc(CFG.nota)+'</span>':'')+'</div>'+
  '<div class="contact"><div class="eyebrow">Contacto · '+esc(c.nombre||'DO SMART')+'</div>'+
  (c.telefono?'<div class="c"><span>'+esc(c.telefono)+'</span><button class="mini" data-copy="'+esc(c.telefono)+'">Copiar</button></div>':'')+
  (c.email?'<div class="c"><span>'+esc(c.email)+'</span><button class="mini" data-copy="'+esc(c.email)+'">Copiar</button></div>':'')+
  (!c.telefono&&!c.email?'<span style="color:var(--mist);font-size:12.5px">Escríbenos para coordinar la visita técnica.</span>':'')+'</div>';
}
document.getElementById('cotizacion').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.mode){Q.mode=b.dataset.mode;lsSet('ds-mode',Q.mode)}
 else if(b.dataset.opt){Q.opts[b.dataset.opt]=!Q.opts[b.dataset.opt];lsSet('ds-opts',Q.opts)}
 else if(b.dataset.copy!=null){var v=b.dataset.copy;try{navigator.clipboard.writeText(v).then(function(){b.textContent='Copiado'},function(){b.textContent='Selecciona el texto'})}catch(err){b.textContent='Selecciona el texto'}return}
 else return;
 renderQuote();
});

/* ---------- admin: DO SMART edits prices and republishes ---------- */
var ART=null;
function buildDoc(cfg){
 var css=document.getElementById('app-css').textContent;
 var js=document.getElementById('app-js').textContent;
 var json=JSON.stringify(cfg).replace(/</g,'\\u003c');
 var S1='</'+'script>';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEADTAGS+'<style id="app-css">'+css+'</style><div id="app"></div><script type="application/json" id="cfg">'+json+S1+'<script id="app-js">'+js+S1+'</body></html>';
}
function openAdmin(){
 var d=document.getElementById('drawer'),c=CFG.contacto||{};
 var h='<div class="in" role="dialog" aria-label="Editar precios"><h3>Precios de la propuesta</h3><p class="hint">Solo tú y los editores ven este panel. Al publicar, el cliente ve los precios nuevos al instante. Montos en soles.</p>';
 h+='<div class="gen"><label>Precios<select id="a-igv"><option value="incluido"'+(CFG.igv==='incluido'?' selected':'')+'>Incluyen IGV</option><option value="mas"'+(CFG.igv==='mas'?' selected':'')+'>Sin IGV (se suma 18 %)</option></select></label><label>Validez<input id="a-val" value="'+esc(CFG.validez)+'"></label>'+
  '<label>Contacto<input id="a-nom" value="'+esc(c.nombre||'')+'"></label><label>Teléfono / WhatsApp<input id="a-tel" value="'+esc(c.telefono||'')+'"></label><label>Correo<input id="a-mail" value="'+esc(c.email||'')+'"></label><label>Nota para el cliente<input id="a-nota" value="'+esc(CFG.nota||'')+'"></label></div>';
 var lastG='';
 CAT.forEach(function(cat){
  var it=item(cat);
  if(cat.g!==lastG){lastG=cat.g;var gn=(GROUPS.find(function(G){return G.g===cat.g})||{name:'Módulos opcionales'}).name;h+='<div class="ar'+(cat.two?' sw':'')+'" style="border-bottom:0;padding-top:16px"><span class="hdr">'+gn+'</span><span class="hdr">Cant.</span><span class="hdr">'+(cat.two?'Sonoff':'P. unit.')+'</span>'+(cat.two?'<span class="hdr">Placa</span>':'')+'</div>'}
  h+='<div class="ar'+(cat.two?' sw':'')+'" data-id="'+cat.id+'"><input class="a-name" value="'+esc(it.name)+'" aria-label="Nombre"><input class="a-qty" type="number" min="0" step="any" value="'+it.qty+'" aria-label="Cantidad"><input class="a-price" type="number" min="0" step="any" value="'+(it.price||'')+'" placeholder="0.00" aria-label="Precio">'+(cat.two?'<input class="a-price2 p2" type="number" min="0" step="any" value="'+(it.price2||'')+'" placeholder="0.00" aria-label="Precio placa">':'')+'</div>';
 });
 h+='<div class="acts"><button class="btn" id="a-cancel">Cerrar</button><button class="btn p" id="a-save">Publicar precios</button></div><div class="status" id="a-status"></div></div>';
 d.innerHTML=h;d.hidden=false;
}
document.getElementById('fab').addEventListener('click',openAdmin);
document.getElementById('drawer').addEventListener('click',function(e){
 var d=document.getElementById('drawer');
 if(e.target===d||e.target.id==='a-cancel'){d.hidden=true;return}
 if(e.target.id!=='a-save')return;
 var cfg={items:{},igv:document.getElementById('a-igv').value,validez:document.getElementById('a-val').value,nota:document.getElementById('a-nota').value,
  contacto:{nombre:document.getElementById('a-nom').value,telefono:document.getElementById('a-tel').value,email:document.getElementById('a-mail').value}};
 d.querySelectorAll('.ar[data-id]').forEach(function(row){
  var id=row.dataset.id,cat=CAT.find(function(c){return c.id===id}),o={};
  var nm=row.querySelector('.a-name').value.trim();if(nm&&nm!==cat.name)o.name=nm;
  var q=row.querySelector('.a-qty').value;if(q!==''&&+q!==cat.qty)o.qty=+q;
  var p=row.querySelector('.a-price').value;if(p!=='')o.price=+p;
  var p2=row.querySelector('.a-price2');if(p2&&p2.value!=='')o.price2=+p2.value;
  if(Object.keys(o).length)cfg.items[id]=o;
 });
 var stt=document.getElementById('a-status');
 CFG=cfg;renderQuote();
 if(!ART){stt.textContent='Vista previa aplicada en esta pantalla. Para que el cliente la vea, abre la página desde tu cuenta de Claude y publica de nuevo.';return}
 e.target.disabled=true;stt.textContent='Publicando…';
 ART.publish(buildDoc(cfg)).then(function(){stt.textContent='Publicado. La página se actualiza para todos.'},function(err){e.target.disabled=false;var code=err&&err.code;stt.textContent=code==='conflict'?'Otra persona publicó al mismo tiempo. La página se recargará con su versión.':code==='not_writer'||code==='not_granted'?'Tu cuenta no puede publicar esta página.':'No se pudo publicar. Intenta otra vez.'});
});
(function(){
 if(!window.claude||!window.claude.use)return;
 window.claude.use('user').then(function(u){return u?u.canEdit():false}).then(function(can){
  if(!can)return;document.getElementById('fab').hidden=false;
  return window.claude.use('artifact').then(function(a){ART=a});
 }).catch(function(){});
})();

/* ---------- wire up ---------- */
document.getElementById('levels').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setLevel(b.dataset.level)});
document.getElementById('scenes').addEventListener('click',function(e){var b=e.target.closest('.scene');if(b)runScene(b.dataset.scene)});
document.getElementById('time').addEventListener('input',function(e){S.time=+e.target.value;updatePlan();renderEcho()});
renderLevels();buildPlan();updatePlan();renderEcho();renderPanel();renderQuote();
})();
</script>
