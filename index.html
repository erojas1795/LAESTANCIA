<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casa La Estancia 3D</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,400;112..125,600;112..125,700;112..125,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><script type="text/plain" id="headtags-src"><title>Casa La Estancia 3D</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,400;112..125,600;112..125,700;112..125,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></script><style id="app-css">/* Layout: a full-bleed 3D study model at dusk; instruments float at the edges like an architect's annotation layer. Single deliberate night look. */
:root{
 --ink:#080b11; --glass:rgba(10,14,22,.66); --line:rgba(236,232,224,.12); --line2:rgba(236,232,224,.22);
 --paper:#ece8e0; --mist:#9aa1ad; --light:#ffbf69; --sound:#c9b8ff; --air:#7fdcff; --ok:#8de3b0;
 --f-wide:"Archivo",ui-sans-serif,system-ui,sans-serif;
 --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--light);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hud{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line)}

/* top */
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:14px;padding:6px 12px 6px 6px;border-radius:10px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mk{font-family:var(--f-wide);font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:.02em;background:var(--light);color:var(--ink);padding:5px 8px;border-radius:4px}
.mk i{font-style:normal;font-weight:400;margin-left:2px}
.pj{font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;line-height:1.2}
.pj em{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;color:var(--mist);text-transform:none}
.loc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:6px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.loc b{font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.loc span{font-family:var(--f-mono);font-size:10.5px;color:var(--mist);letter-spacing:.06em}
.qbtn{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* section (levels) */
.section{padding:8px 10px 8px 8px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.lv{display:grid;grid-template-columns:26px auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;background:none;border:0;padding:6px 8px 6px 0;text-align:left}
.lv .bar{grid-row:1/3;height:30px;border:1px solid var(--line2);border-radius:3px;background:rgba(255,255,255,.03);transition:background .3s,border-color .3s}
.lv .ln{font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.lv .np{font-family:var(--f-mono);font-size:10px;color:var(--mist);opacity:.7}
.lv[aria-pressed="true"] .bar{background:var(--light);border-color:var(--light);box-shadow:0 0 18px rgba(255,191,105,.5)}
.lv[aria-pressed="true"] .ln{color:var(--paper)}
.lv:hover .bar{border-color:var(--light)}

/* labels */
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(8,11,17,.55);padding:3px 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent;transition:border-color .2s,color .2s}
.lb:hover{border-color:var(--line2)}
.lb.sel{border-color:var(--light);color:var(--light)}
.lb.ctx{opacity:.55;cursor:default}
.lb.sm{font-size:9px;padding:2px 5px;opacity:.8}
body.walking #labels{display:none}

/* dock */
.dock{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5;width:250px}
.modes{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modes button{background:none;border:0;border-radius:999px;padding:8px 0;font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.clock-r{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.clock-r input{flex:1;min-width:0;accent-color:var(--light)}
.clock-r .num{font-size:13px;min-width:40px;text-align:right}
.snd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--mist);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.snd svg{width:16px;height:16px}
.snd[aria-pressed="true"]{color:var(--sound);border-color:rgba(201,184,255,.4)}

/* scenes */
.scenes{position:absolute;left:290px;right:336px;justify-content:center;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:5;overflow-x:auto;scrollbar-width:none;padding:2px}
.scenes::-webkit-scrollbar{display:none}
.sc:first-child{margin-left:auto}.sc:last-child{margin-right:auto}
.sc{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);text-align:left;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s,transform .2s}
.sc b{font-family:var(--f-wide);font-stretch:125%;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.sc span{font-family:var(--f-mono);font-size:10.5px;color:var(--mist)}
.sc:hover{border-color:var(--light);transform:translateY(-2px)}
.sc.run{border-color:var(--light);box-shadow:0 0 0 1px var(--light) inset}

/* echo */
.echo{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;z-index:5;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,rgba(40,30,22,.7),rgba(10,14,22,.78));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.eh{display:flex;justify-content:space-between;align-items:center}
.clock{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:-.01em;line-height:1}
.ring{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.15)}
.ring.on{border-color:var(--air);box-shadow:0 0 16px var(--air);animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 28px var(--air)}}
.greet{font-size:12px;color:var(--mist);margin-top:4px}
.say{font-family:var(--f-wide);font-stretch:112%;font-weight:600;font-size:15px;margin-top:10px}
.say.dim{color:var(--mist);font-weight:400;font-size:13px;font-family:var(--f-body)}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:84px;overflow:hidden}
.steps li{font-size:12.5px;display:flex;gap:7px;align-items:center;animation:si .3s ease both}
.steps li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
@keyframes si{from{opacity:0;transform:translateX(-4px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mist)}
.stats span{display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--paper)}

/* panel */
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:66px;bottom:calc(16px + env(safe-area-inset-bottom,0px) + 290px);width:300px;z-index:5;padding:14px 16px;border-radius:16px;overflow-y:auto;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateX(calc(100% + 24px));transition:transform .35s ease}
.panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ph h3{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase;margin:3px 0 0;line-height:1.1}
.ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:none;display:grid;place-items:center;flex:none;padding:0}
.ic svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--mist)}
.chip.s{border-color:rgba(201,184,255,.4);color:var(--sound)}
.blk{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.k{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.k svg{width:14px;height:14px}
.k em{font-style:normal;letter-spacing:.04em;text-transform:none;color:#e9c37a;opacity:.85}
.k.l{color:var(--light)} .k.s{color:var(--sound)} .k.a{color:var(--air)}
.mini{background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--mist);margin-left:4px}
.mini:hover{color:var(--paper)}
.circs{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.circ{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:12.5px;text-align:left;transition:background .2s,border-color .2s}
.circ i{width:9px;height:9px;border-radius:50%;background:#3a3f48;flex:none;transition:background .25s,box-shadow .25s}
.circ[aria-pressed="true"]{border-color:rgba(255,191,105,.55);background:rgba(255,191,105,.09)}
.circ[aria-pressed="true"] i{background:var(--light);box-shadow:0 0 10px var(--light)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--sound);background:none;color:var(--sound);display:grid;place-items:center;flex:none}
.play svg{width:14px;height:14px}
.play[aria-pressed="true"]{background:var(--sound);color:var(--ink)}
.row select{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:7px;padding:6px;font-size:12.5px}
input[type=range]{width:100%}
.rs{accent-color:var(--sound);margin-top:8px}.rc{accent-color:var(--light)}
.rd{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:none;font-size:16px;line-height:1}
.deg{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:28px;min-width:64px;text-align:center;line-height:1}
.deg small{font-size:12px;color:var(--mist);font-weight:400}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{border:1px solid var(--line2);background:none;border-radius:6px;padding:4px 7px;font-size:11px;color:var(--mist)}
.seg button[aria-pressed="true"]{border-color:var(--air);color:var(--air)}
.tog{position:relative;width:38px;height:22px;border-radius:99px;border:1px solid var(--line2);background:rgba(0,0,0,.3);padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--mist);transition:transform .2s,background .2s}
.tog[aria-pressed="true"]::after{transform:translateX(16px);background:var(--ok)}
.tog.a[aria-pressed="true"]::after{background:var(--air)}
.hint{font-size:12px;color:var(--mist);margin:8px 0 0}

/* walk */
.walkhint{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:4;font-size:12px;color:var(--mist);background:var(--glass);border:1px solid var(--line);padding:6px 12px;border-radius:999px;display:none;white-space:nowrap}
kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;margin-right:2px;color:var(--paper)}
body.walking .walkhint{display:block}
body.walking #gl{cursor:crosshair}
.joy{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(200px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,14,22,.35);z-index:6;display:none;touch-action:none}
.joyk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--paper);opacity:.85}
@media (pointer:coarse){body.walking .joy{display:block}body.walking .walkhint{display:none}}

/* intro */
.intro{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(8,11,17,0) 20%,rgba(8,11,17,.75) 55%,rgba(8,11,17,.95) 100%);transition:opacity .8s ease}
.intro.gone{opacity:0;pointer-events:none}
.ii{max-width:640px}
.intro h1{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:clamp(44px,8vw,104px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;margin:10px 0 14px}
.intro p{color:var(--mist);font-size:15px;max-width:52ch;margin:0}
.facts{display:flex;gap:22px;margin:18px 0 22px;flex-wrap:wrap}
.facts span{display:flex;flex-direction:column;font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.12em;font-family:var(--f-mono)}
.facts b{font-family:var(--f-wide);font-stretch:125%;font-size:26px;color:var(--paper);letter-spacing:0}
.go{background:var(--light);color:var(--ink);border:0;border-radius:999px;padding:13px 24px;font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}

/* quote */
.quote{position:absolute;inset:0;z-index:15;background:rgba(6,8,12,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto}
.qin{max-width:1100px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.qhead h2{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:clamp(28px,4.5vw,52px);text-transform:uppercase;line-height:.95;margin:8px 0 22px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.qmodes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.qmodes button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:none}
.qmodes b{display:block;font-family:var(--f-wide);font-stretch:112%;font-size:14px}
.qmodes span{font-size:12px;color:var(--mist)}
.qmodes button[aria-pressed="true"]{border-color:var(--light);box-shadow:0 0 0 1px var(--light) inset}
.qt{width:100%;border-collapse:collapse}
.qt td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
.qt td b{font-weight:500}
.qt td span{display:block;font-size:12px;color:var(--mist);margin-top:1px}
.qt td.n{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;padding-left:14px}
.qt i{font-style:normal;color:#e9c37a}
.qt .gh td{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--light);padding-top:22px;border-bottom-color:var(--line2)}
.qopt{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt .tag{grid-column:1/-1;color:var(--light)}
.oi{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.oi.on{border-color:rgba(141,227,176,.45)}
.oi input{accent-color:var(--ok);margin-top:3px}
.oi span{flex:1;min-width:0}
.oi b{display:block;font-weight:500;font-size:13px}
.oi small{display:block;font-size:11.5px;color:var(--mist)}
.oi em{font-style:normal;font-family:var(--f-mono);font-size:12px}
.qsum{position:sticky;top:0;padding:18px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.qsum .big{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:34px;margin:4px 0}
.qsum .sm{font-size:12px;color:var(--mist);margin-top:6px}
.qsum .pend{font-size:12px;color:#e9c37a;margin-top:10px}
.qsum .ct{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:13px}
.qsum .sel{user-select:all;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.qfoot{color:var(--mist);font-size:12px;margin-top:28px}

/* admin */
.fab{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:62px;z-index:16;background:none;border:1px dashed var(--light);color:var(--light);border-radius:999px;padding:6px 12px;font-size:11.5px}
.drawer{position:absolute;inset:0;z-index:25;background:rgba(5,7,9,.6);display:flex;justify-content:flex-end}
.din{width:min(560px,100%);height:100%;overflow-y:auto;background:#0e131c;border-left:1px solid var(--line2);padding:20px max(16px,env(safe-area-inset-right,0px)) 30px 18px}
.din h3{font-family:var(--f-wide);font-stretch:125%;font-size:20px;text-transform:uppercase;margin:4px 0 0}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.gen label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mist)}
.din input,.din select{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;width:100%;min-width:0}

function resize(){var w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
var clock=new THREE.Clock(),autoSpin=true,poolT=0,audT=0,hud=0;
function frame(){
 var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;resize();
 if(S.mode==='orbit'){
  if(orb.goal){var g=orb.goal;g.t=Math.min(1,g.t+dt/1.3);var e=g.t<.5?4*g.t*g.t*g.t:1-Math.pow(-2*g.t+2,3)/2;orb.target.set(lerp(g.from.x,g.to.x,e),lerp(g.from.y,g.to.y,e),lerp(g.from.z,g.to.z,e));orb.r=lerp(g.from.r,g.to.r,e);orb.th=lerp(g.from.th,g.to.th,e);orb.ph=lerp(g.from.ph,g.to.ph,e);if(g.t>=1)orb.goal=null}
  else if(autoSpin)orb.th+=dt*.06;
  placeOrbit();
 }else stepWalk(dt);
 water.uniforms.t.value=t;
 /* AC particles */
 ROOMS.forEach(function(r){var d=DEV[r.id];if(!d||!d.ac)return;var on=st(r.id).ac.on&&GROUP[r.lvl].visible,A=d.ac;A.pts.material.opacity=lerp(A.pts.material.opacity,on?.85:0,dt*3);if(A.pts.material.opacity<.01)return;
  for(var i=0;i<A.n;i++){var p=(A.s[i]+t*.35)%1;A.a[i*3]=A.o[0]+(A.s[(i*7)%A.n]-.5)*.8;A.a[i*3+1]=A.o[1]-p*1.4;A.a[i*3+2]=A.o[2]+p*1.6+Math.sin(p*6+i)*.05}A.pts.geometry.attributes.position.needsUpdate=true});
 /* speakers */
 ROOMS.forEach(function(r){var d=DEV[r.id];if(!d||!d.spk)return;var on=st(r.id).mus.on;d.spk.forEach(function(sp,k){sp.rings.forEach(function(rg,i){var p=((t*.6+i/3+k*.17)%1);rg.scale.setScalar(on?.5+p*3.2:1);rg.material.opacity=on?(1-p)*.7:0});if(sp.ring)sp.ring.material.color.set(listening&&r.id===S.sel?0x46d4ff:(on?0x6f62b8:0x2b3a46))})});
 /* cascade */
 var cv=S.cascada&&GROUP.p1.visible;cascPts.p.visible=cv;if(cv){for(var i=0;i<cascPts.n;i++){var p=(cascPts.s[i]+t*.9)%1;cascPts.a[i*3]=21.6+cascPts.s[(i*5)%cascPts.n]*2.3;cascPts.a[i*3+1]=1.15-p*p*1.3;cascPts.a[i*3+2]=17.85-p*.35}cascPts.p.geometry.attributes.position.needsUpdate=true}
 assignPool();
 if(lastLabelLevel!==S.level+S.mode){lastLabelLevel=S.level+S.mode;renderLabels()}placeLabels();
 audT+=dt;if(audT>.1){audT=0;audioTick()}
 var nowp=performance.now();if(nowp-hud>200){hud=nowp;var x=camera.position;var here=S.mode==='walk'?RM[roomAt(S.level,walk.x,walk.z)]:RM[S.sel];$('loc').innerHTML='<b>'+(here?esc(here.name):'Exterior')+'</b><span>'+LV[S.level].name+' · '+LV[S.level].npt+'</span><span class="num">X '+(S.mode==='walk'?walk.x:orb.target.x).toFixed(2)+' · Z '+(S.mode==='walk'?walk.z:orb.target.z).toFixed(2)+'</span>'}
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}
